<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wild Push &amp; Smash</title>
    <link rel="stylesheet" href="./css/game.css">
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1120" height="630"></canvas>

    <div class="ui-layer">
        <div class="scoreboard">
            <span class="p1-score"><span class="hearts" id="heartsP1">♥♥♥</span><span class="pips" id="winsP1">○○○</span></span>
            <span class="p2-score"><span class="hearts" id="heartsP2">♥♥♥</span><span class="pips" id="winsP2">○○○</span></span>
        </div>
        <!-- Medidor de especial: cheio, o próximo DASH vira o DASH TURBO (tira um coração) -->
        <div class="special special-p1" id="specialP1"><i></i><span>TURBO</span></div>
        <div class="special special-p2" id="specialP2"><i></i><span>TURBO</span></div>
        <div class="timer-display" id="timerDisplay">60</div>
        <div class="round-label" id="roundLabel">ROUND 1</div>
        <div id="comboBanner" class="combo-banner">SMASH!</div>
        <!-- Teclas desenhadas de cada jogador (montadas por js/ui/controls_hint.js) -->
        <div class="controls-hint" id="controlsHint"></div>
    </div>

    <!-- Tela Inicial / Game Over -->
    <div id="screenMenu" class="overlay menu">
        <!-- Coluna 1: quem luta -->
        <section class="menu-fighters">
            <!-- Textos vêm de data_model/texts.js (no fim da partida viram o placar) -->
            <h1 id="menuTitle"></h1>
            <p id="menuSub"></p>
            <div class="select-row">
                <div class="picker" id="picker0"></div>
                <span class="vs">VS</span>
                <div class="picker" id="picker1"></div>
            </div>
        </section>
        <!-- Coluna 2: onde luta e como começar -->
        <section class="menu-side">
            <div class="side-block">
                <span class="side-label">ARENA</span>
                <div class="stage-row" id="stageRow"></div>
            </div>
            <div class="side-block" id="levelRow"></div>
            <div class="btn-group">
                <button id="btn1Player" class="btn btn-play"><span>1 PLAYER</span><small>VS AI BOT</small></button>
                <button id="btn2Players" class="btn btn-play btn-p2"><span>2 PLAYERS</span><small>1 KEYBOARD</small></button>
            </div>
        </section>
    </div>
    <button id="btnGear" class="gear-btn" aria-label="Settings" title="Settings (Esc)">🎮</button>

    <!-- Settings -->
    <div id="screenSettings" class="overlay settings hidden">
        <h2>🎮 SETTINGS</h2>
        <div class="set-row touch-only"><span>Button size</span>
            <input type="range" id="setSize" min="0.6" max="1.6" step="0.05" value="1"></div>
        <div class="set-row touch-only"><span>Distance from edge</span>
            <input type="range" id="setOffX" min="0" max="220" step="2" value="14"></div>
        <div class="set-row touch-only"><span>Button height</span>
            <input type="range" id="setOffY" min="0" max="260" step="2" value="14"></div>
        <div class="set-row touch-only" id="rowSwap"><span>Joystick side (1 player)</span>
            <button class="toggle" id="setSwap">LEFT</button></div>
        <div class="set-row"><span>🎵 Music</span><button class="toggle" id="setMusic">ON</button></div>
        <div class="set-row"><span>🔊 Sound effects</span><button class="toggle" id="setSfx">ON</button></div>
        <div class="btn-group">
            <button class="btn" id="btnResume">RESUME</button>
            <button class="btn btn-ghost" id="btnRestart">RESTART MATCH</button>
            <button class="btn btn-danger" id="btnQuit">GIVE UP</button>
        </div>
    </div>
</div>

<div id="touchControls" class="touch hidden">
    <div class="pad" id="padLeft"></div>
    <div class="pad" id="padRight"></div>
</div>

<!-- AVISO DE VIRAR O APARELHO (celular em pé; o jogo é jogado de lado) -->
<div id="rotateNotice" role="alert">
    <div class="rotate-phone" aria-hidden="true"></div>
    <p>TURN YOUR PHONE SIDEWAYS</p>
    <span>Wild Push &amp; Smash is played in landscape, with both thumbs. The match is paused.</span>
</div>

<script type="module" src="./js/game.js"></script>
</body>
</html>
