<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévia do Demon Hunter</title>
    <style>
        body { margin: 0; background: #050b16; }
        canvas { display: block; margin: 0 auto; max-width: 100%; }
    </style>
</head>
<body>
    <!-- Página de desenvolvimento: tudo do herói (corrida, golpes, dash, efeitos, heróis alternativos, clone, Juramentos,
         golpes especiais, skills dos quatro ramos e adaga)
         usando o código real do jogo. Como abrir: previews/README.md -->
    <canvas id="gameCanvas" width="1200" height="6000"></canvas>
    <!-- Aberta direto do disco (file://) o navegador bloqueia os módulos e o canvas ficaria preto: avisa na tela -->
    <script>
        if (location.protocol === 'file:') {
            const g = document.getElementById('gameCanvas').getContext('2d');
            g.fillStyle = '#050b16';
            g.fillRect(0, 0, 1200, 6000);
            g.textAlign = 'center';
            g.fillStyle = '#fbbf24';
            g.font = '600 26px system-ui, sans-serif';
            g.fillText('Esta página precisa de um servidor local', 600, 130);
            g.fillStyle = '#cbd5e1';
            g.font = '400 18px system-ui, sans-serif';
            g.fillText('O navegador bloqueia módulos abertos direto do disco.', 600, 170);
            g.fillText('No terminal:  cd mini_games/last_torch && python3 -m http.server 8000', 600, 220);
            g.fillText('Depois abra:  http://localhost:8000/previews/demon_hunter_preview.html', 600, 255);
        }
    </script>
    <script type="module">
        import { HEROES } from '../data_model/heroes.js';
        import { KNIFE_SKILL } from '../data_model/skills.js';
        import { EVOLUTIONS } from '../data_model/powers.js';
        import { HERO_25D_VISUALS } from '../data_model/visuals/characters/hero25d_visual.js';
        import { OATH_VISUALS } from '../data_model/visuals/characters/oath_visual.js';
        import { SHADOW_CLONE_VISUALS } from '../data_model/visuals/characters/shadow_clone_visual.js';
        import { KNIFE_VISUALS as K } from '../data_model/visuals/effects/knife_visual.js';
        import { SLASH_VISUALS } from '../data_model/visuals/effects/slash_visual.js';
        import { LEVEL_UP_VISUALS } from '../data_model/visuals/effects/level_up_visual.js';
        import { ctx, passives, player, powers, shadowClones, state } from '../js/core/state.js';
        import { updateShadowClone } from '../js/systems/shadow_clone.js';
        import { renderCore } from '../js/render/arena.js';
        import { renderShadowClone } from '../js/render/shadow_clone.js';
        import { addCracks } from '../js/systems/skills_blade.js';
        import { renderShockwaves } from '../js/render/effects.js';
        import { renderBladeSlashes, renderKnives } from '../js/render/entities.js';
        import { drawGlow } from '../js/render/fx/glow.js';
        import { setWorldView } from '../js/render/fx/stamp.js';
        import { getOathPalette } from '../js/render/hero_gear.js';
        import { drawDagger } from '../js/render/knife.js';
        import { renderLevelUpBack, renderLevelUpFront } from '../js/render/level_up.js';
        import { createHeroAnim, heroAnim, updateHeroAnim } from '../js/render/player.js';
        import { renderPlayer25D } from '../js/render/player25d.js';
        import { renderBolts, renderDashGhosts, renderLightning } from '../js/render/powers.js';
        import { renderReflectWard } from '../js/render/reflect.js';
        import {
            renderCracks, renderCrescents, renderFireRing, renderMonsterCurses, renderPhoenix, renderRifts,
            renderShield, renderSkillAuras, renderSkillHits, renderSmokes, renderWisp
        } from '../js/render/skills.js';

        state.gameState = 'PLAYING';     // o herói só anima durante a partida
        const WIDTH = 1200;
        const HEIGHT = 6000;
        const start = performance.now();
        let last = start;

        function text(str, x, y, size = 13, color = '#cbd5e1', weight = 400) {
            ctx.fillStyle = color;
            ctx.font = `${weight} ${size}px system-ui, sans-serif`;
            ctx.fillText(str, x, y);
        }

        function panel(x, y, w, h, draw) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#0b1424';
            ctx.fillRect(0, 0, w, h);
            ctx.beginPath();
            ctx.rect(0, 0, w, h);
            ctx.clip();
            draw();
            ctx.restore();
        }

        // --- CENAS ---
        // O desenho do herói lê o objeto `player`: cada cena guarda o próprio herói e o copia para lá antes de desenhar.
        // Ela anda de verdade, com a câmera seguindo, para a corrida, a capa e a passada funcionarem.
        function scene(opts = {}) {
            return {
                body: {
                    x: 0, y: 0, angle: 0, comboStep: 1, hitTime: -100000, hitDirX: 0, hitDirY: 0, iFrames: 0, reflectTimer: 0, reflectTime: -100000,
                    move: null, castAge: -1, dashTimer: 0, vigilStance: false, shield: 0
                },
                anim: createHeroAnim(opts.throwsKnives ?? false),
                slashes: [],
                ghosts: [],
                colors: HERO_25D_VISUALS.colors,
                speed: 0,
                heading: 0,
                gear: null,
                fx: createFx(),
                levels: {},             // poderes ligados só nesta cena: { chave: nível }
                evolved: [],
                ...opts
            };
        }

        // Cena do Shadow Clone: roda o sistema de verdade (js/systems/shadow_clone.js) em volta de uma tocha. As sombras
        // são uma lista global do jogo, então cada cena guarda as suas e as devolve depois de desenhar.
        function loadGuard(s) {
            shadowClones.splice(0, shadowClones.length, ...(s.clones ?? []));
            passives.shadowClone.lvl = 1;
            passives.shadowClone.evolved = s.legion ?? false;
            state.coreX = s.body.x;
            state.coreY = s.body.y;
            state.coreHpMax = 100;
            state.coreHp = 100;
            state.enemies = s.fx.enemies;
            state.bladeSlashes = s.slashes;
        }

        function unloadGuard(s) {
            s.clones = [...shadowClones];
            shadowClones.length = 0;
            passives.shadowClone.lvl = 0;
            passives.shadowClone.evolved = false;
        }

        // Monstros que se aproximam da tocha em ângulos diferentes; as sombras os recebem no anel
        function guardLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2.4;
            const r = 215 - (s.clock / 2.4) * 165;
            s.fx.enemies.forEach((e, i) => {
                const a = e.angle + (s.clock / 2.4) * 0.5;
                e.x = s.body.x + Math.cos(a) * r;
                e.y = s.body.y + Math.sin(a) * r;
            });
            updateShadowClone(dt);
        }

        function guardMonsters(angles) {
            return angles.map(angle => ({ x: 0, y: 0, vx: 0, vy: 0, radius: 14, hp: 1e9, maxHp: 1e9, color: '#94a3b8', angle }));
        }

        // Cena virada para a câmera: é de onde os golpes se leem melhor
        function front(opts = {}) {
            const s = scene(opts);
            s.anim.facing = opts.facing ?? 1.15;
            return s;
        }

        // Listas de efeitos que o jogo guarda em `state`: cada cena tem as suas
        function createFx() {
            return { cracks: [], shockwaves: [], crescents: [], executions: [], markBursts: [], smokes: [], rifts: [], enemies: [], bolts: [], lightning: [] };
        }

        // Liga e desliga os poderes da cena em volta do desenho
        function withLevels(s, draw) {
            Object.entries(s.levels).forEach(([key, lvl]) => { powers[key].lvl = lvl; });
            s.evolved.forEach(key => { powers[key].evolved = true; });
            const undo = s.tweak?.();       // ajuste só da cena (por exemplo, um anel menor para caber no quadro)
            draw();
            undo?.();
            Object.keys(s.levels).forEach(key => { powers[key].lvl = 0; });
            s.evolved.forEach(key => { powers[key].evolved = false; });
        }

        // Efeitos andam sozinhos na prévia: idade, sumiço e voo
        function ageFx(fx, dt) {
            const aged = (list) => list.filter(item => (item.age += dt) < item.seconds);
            fx.shockwaves = aged(fx.shockwaves);
            fx.executions = aged(fx.executions);
            fx.markBursts = aged(fx.markBursts);
            fx.smokes = aged(fx.smokes);
            fx.rifts = aged(fx.rifts);
            fx.cracks = fx.cracks.filter(c => (c.life -= dt) > 0);
            fx.crescents = fx.crescents.filter(w => {
                w.age += dt;
                w.x += w.vx * dt;
                w.y += w.vy * dt;
                return w.age < 0.6;
            });
            fx.lightning = fx.lightning.filter(b => (b.life -= dt) > 0);
        }

        function renderScene(s, dt) {
            const b = s.body;
            b.x += Math.cos(s.heading) * s.speed * dt;
            b.y += Math.sin(s.heading) * s.speed * dt;
            Object.assign(player, b);
            if (s.guard) loadGuard(s);
            s.before?.(s, dt);
            Object.assign(player, b);
            updateHeroAnim(s.anim, player);

            s.slashes.forEach(c => { c.life -= dt; });
            s.slashes = s.slashes.filter(c => c.life > 0);
            state.bladeSlashes = s.slashes;
            s.ghosts.forEach(g => { g.age += dt; });
            s.ghosts = s.ghosts.filter(g => g.age < g.seconds);
            state.dashGhosts = s.ghosts;
            state.frenzyActiveTimer = s.frenzy ? 1 : 0;
            state.levelUpFx = s.levelUp ?? null;
            passives.mirrorWard.lvl = s.ward ? 1 : 0;
            ageFx(s.fx, dt);
            Object.assign(state, s.fx);
            state.oath = s.oath ?? null;
            state.coreX = s.body.x;
            state.coreY = s.body.y;

            withLevels(s, () => {
                renderCracks();
                renderFireRing();
                renderRifts();
                s.behind?.(s);
                // Monstro de mentira: só um alvo para os efeitos
                state.enemies.forEach(e => {
                    ctx.fillStyle = '#475569';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                renderMonsterCurses();
                renderDashGhosts();
                renderLevelUpBack();
                renderSkillAuras();
                if (s.guard) {
                    renderCore();
                    renderShadowClone();
                }
                if (!s.noHero) renderPlayer25D(player, s.anim, s.colors, s.gear);
                renderShield();
                renderWisp();
                renderBladeSlashes();
                renderBolts();
                renderLightning();
                renderReflectWard();
                renderCrescents();
                renderSkillHits();
                renderSmokes();
                renderPhoenix();
                renderShockwaves();
                renderLevelUpFront();
            });
            if (s.guard) unloadGuard(s);
            state.frenzyActiveTimer = 0;
            state.bladeSlashes = [];
            state.dashGhosts = [];
            state.levelUpFx = null;
            state.knifeCharge = 0;
            state.bloodlust.stacks = 0;
            state.warCryTimer = 0;
            state.phoenixFx = null;
            state.oath = null;
            Object.assign(state, createFx());
        }

        // Quadro de 1 cena: amplia e centraliza a câmera no herói
        function view(s, x, y, w, h, zoom, dt, offsetY = 12) {
            panel(x, y, w, h, () => {
                ctx.scale(zoom, zoom);
                ctx.translate(w / 2 / zoom - s.body.x, h / 2 / zoom + offsetY - s.body.y);
                renderScene(s, dt);
            });
        }

        // Golpe em loop: comboStep muda (é assim que o jogo avisa o desenho) e a marca do corte nasce junto
        function slashEvery(seconds, step, spin = false) {
            let wait = 0.4;
            return (s, dt) => {
                wait -= dt;
                if (wait > 0) return;
                wait = seconds;
                const look = spin ? SLASH_VISUALS.whirl : SLASH_VISUALS[step];
                s.anim.lastComboStep = step;
                s.body.comboStep = step === 3 ? 1 : step + 1;
                s.slashes.push({ x: s.body.x, y: s.body.y, angle: s.body.angle, radius: 70, comboStep: step, spin, shadow: false, arcWidth: 1.4, life: look.lifeSeconds, maxLife: look.lifeSeconds });
            };
        }

        const octants = Array.from({ length: 8 }, (_, i) => (i / 8) * Math.PI * 2 - Math.PI / 2);
        const OCTANT_NAMES = ['cima', 'cima-direita', 'direita', 'baixo-direita', 'baixo', 'baixo-esquerda', 'esquerda', 'cima-esquerda'];
        const running = octants.map(a => scene({ speed: 150, heading: a }));

        const poses = [
            ['parado', scene()],
            ['andando devagar', scene({ speed: 60, heading: 0.6 })],
            ['Fúria ativa', scene({ speed: 150, heading: 0.6, frenzy: true })],
            ['invulnerável', scene({ speed: 150, heading: 2.6, before: (s) => { s.body.iFrames = 1; } })]
        ];

        const swings = [
            ['1º golpe', scene({ before: slashEvery(1, 1) })],
            ['2º golpe', scene({ before: slashEvery(1, 2) })],
            ['3º golpe', scene({ before: slashEvery(1, 3) })],
            ['Whirlwind (360°)', scene({ before: slashEvery(1, 3, true) })]
        ];

        // Dash: arranque rápido, com os fantasmas que ficam para trás, e volta ao início
        function dashLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            const dashing = s.clock < 0.18;
            s.body.dashTimer = dashing ? 1 : 0;
            s.speed = dashing ? 620 : 0;
            if (dashing) s.ghosts.push({ x: s.body.x, y: s.body.y, age: 0, seconds: 0.3, angle: 0 });
            if (s.clock > 1.2) {
                s.clock = 0;
                s.body.x = 0;
                s.anim.lastX = 0;
            }
        }

        function hurtLoop(s, dt) {
            s.clock = (s.clock ?? 1) + dt;
            if (s.clock < 1.2) return;
            s.clock = 0;
            s.body.hitTime = performance.now();
            s.body.hitDirX = -1;
            s.body.hitDirY = 0;
            s.body.iFrames = 0.6;
        }

        function levelLoop(s, dt) {
            s.levelUp = s.levelUp ?? { age: 0, label: '+1 SKILL POINT' };
            s.levelUp.age += dt;
            if (s.levelUp.age > LEVEL_UP_VISUALS.durationSeconds + 0.5) s.levelUp = { age: 0, label: '+1 SKILL POINT' };
        }

        const effects = [
            ['dash', scene({ heading: 0, before: dashLoop })],
            ['levando dano', scene({ before: hurtLoop })],
            ['subindo de nível', scene({ before: levelLoop })],
            ['Mirror Ward (pronto)', scene({ ward: true })]
        ];

        const heroes = Object.values(HEROES).map(hero => [hero.name, scene({ speed: 150, heading: 0.5, colors: hero.colors ?? HERO_25D_VISUALS.colors })]);
        const clone = scene({
            speed: 120, heading: 0.5, colors: SHADOW_CLONE_VISUALS.colors,
            behind: () => drawGlow(ctx, SHADOW_CLONE_VISUALS.auraColor, player.x, player.y, SHADOW_CLONE_VISUALS.auraRadius, 1)
        });

        // --- JURAMENTOS ---
        const OATHS = [
            ['slaughter', 'Oath of Slaughter'], ['whispers', 'Oath of Whispers'],
            ['hearth', 'Oath of the Hearth'], ['ruin', 'Oath of Ruin']
        ];
        const OATH_KEYS = { slaughter: 'oathSlaughter', whispers: 'oathWhispers', hearth: 'oathHearth', ruin: 'oathRuin' };
        const oathScene = (gear, opts) => front({ gear, oath: OATH_KEYS[gear], colors: getOathPalette(gear, HERO_25D_VISUALS.colors), ...opts });
        const oathIdle = OATHS.map(([gear, name]) => [name, oathScene(gear, {})]);
        const oathRun = OATHS.map(([gear, name], i) => [`${name}: correndo`, oathScene(gear, { speed: 150, heading: 0.5 + i * 1.6 })]);
        const oathSwing = OATHS.map(([gear, name]) => [`${name}: golpe`, oathScene(gear, { before: slashEvery(0.9, 2) })]);

        // --- GOLPES ESPECIAIS ---
        // Golpe em loop com o relógio da própria cena, como em js/systems/moves.js
        function moveLoop(kind, pause, onImpact) {
            const { seconds, impactAt } = HERO_25D_VISUALS.moves[kind];
            let wait = 0.4;
            return (s, dt) => {
                const move = s.body.move;
                if (move) {
                    move.age += dt;
                    if (!move.hit && move.age >= seconds * impactAt) {
                        move.hit = true;
                        onImpact?.(s);
                    }
                    if (move.age >= seconds) {
                        s.body.move = null;
                        wait = pause;
                    }
                    return;
                }
                wait -= dt;
                if (wait <= 0) s.body.move = { kind, age: 0, seconds, impactAt };
            };
        }

        function wave(s, radius, color, width = 8, seconds = 0.4) {
            s.fx.shockwaves.push({ x: s.body.x, y: s.body.y, radius, color, width, age: 0, seconds });
        }

        function slamImpactFx(molten) {
            return (s) => {
                state.cracks = s.fx.cracks;
                addCracks(s.body.x, s.body.y, 120, molten);
                wave(s, 110, '#e7e0cf', 12);
                wave(s, 70, '#fb923c', 6, 0.3);
            };
        }

        // Dash contínuo: a pose e os fantasmas, voltando ao início do quadro
        function dashPose(s, dt) {
            s.body.dashTimer = 1;
            s.speed = 170;
            s.heading = 0;
            if (Math.random() < 0.35) s.ghosts.push({ x: s.body.x - 30, y: s.body.y, age: 0, seconds: 0.3, angle: 0 });
            if (s.body.x > 60) {
                s.body.x = -60;
                s.anim.lastX = -60;
            }
        }

        function chargeLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2;
            state.knifeCharge = Math.min(1.2, s.clock * 0.9);
        }

        function castLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            if (s.clock > 1) {
                s.clock = 0;
                s.body.castAge = 0;
            }
            if (s.body.castAge >= 0) s.body.castAge = s.body.castAge + dt >= HERO_25D_VISUALS.moves.cast.seconds ? -1 : s.body.castAge + dt;
        }

        const heroMoves = [
            ['Earthbreaker: salto', front({ before: moveLoop('slam', 0.7, slamImpactFx(false)) })],
            ['War Cry', front({ before: moveLoop('roar', 0.8, (s) => { wave(s, 110, '#ef4444', 10); wave(s, 70, '#fecaca', 5, 0.3); }) })],
            ['Juramento: ajoelha e ergue', front({ before: moveLoop('oath', 0.8) })],
            ['Vigil: ajoelhado', front({ before: (s) => { s.body.vigilStance = true; s.body.shield = 1; } })]
        ];

        // Quadro a quadro: o golpe congelado em instantes escolhidos (fração da animação)
        function frozenMove(kind, k) {
            const { seconds, impactAt } = HERO_25D_VISUALS.moves[kind];
            return front({ before: (s) => { s.body.move = { kind, age: seconds * k, seconds, impactAt }; } });
        }
        const slamFrames = [[0.12, 'agacha'], [0.3, 'sobe'], [0.46, 'no alto'], [0.56, 'desce'], [0.63, 'crava'], [0.8, 'levanta']]
            .map(([k, name]) => [name, frozenMove('slam', k)]);
        const oathFrames = [[0.18, 'ajoelha'], [0.32, 'ajoelhado'], [0.45, 'levanta'], [0.7, 'espada erguida']]
            .map(([k, name]) => [name, frozenMove('oath', k)]);
        const heroMoves2 = [
            ['Dash: corpo baixo', scene({ before: dashPose })],
            ['Soul Lance: carregando', front({ levels: { soulLance: 5 }, before: chargeLoop })],
            ['Feitiço: mão erguida', front({ before: castLoop })],
            ['Earthbreaker sob Slaughter', oathScene('slaughter', { before: moveLoop('slam', 0.7, slamImpactFx(true)) })]
        ];

        // --- SKILLS DOS RAMOS ---
        function dummy(dx, dy, extra = {}) {
            return { x: dx, y: dy, radius: 14, hp: 1, maxHp: 1, ...extra };
        }

        function bloodlustLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 3;
            state.bloodlust.stacks = Math.ceil(s.clock / 3 * 11);
        }

        function crescentLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            state.bloodlust.stacks = 14;
            if (s.clock < 0.5) return;
            s.clock = 0;
            s.body.comboStep = s.body.comboStep === 1 ? 2 : 1;
            s.anim.lastComboStep = s.body.comboStep === 1 ? 2 : 1;
            s.fx.crescents.push({ x: s.body.x, y: s.body.y, angle: 0, vx: 300, vy: 0, age: 0 });
        }

        function executeLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            if (s.clock < 0.9) return;
            s.clock = 0;
            s.fx.executions.push({ x: 40, y: 0, angle: 0.5, age: 0, seconds: 0.26, radius: 14 });
        }

        function markLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            s.fx.enemies[0].marked = s.clock < 1.4 ? 1 : 0;
            if (s.clock > 1.8) {
                s.clock = 0;
                s.fx.markBursts.push({ x: 44, y: 0, age: 0, seconds: 0.3, radius: 14, big: true });
            }
        }

        // Smoke Bomb: o herói avança deixando uma nuvem a cada 34, como em js/systems/skills_shadow.js. No jogo elas
        // ficam 7s; aqui somem em 2s para o loop fechar sem nuvens sobrando.
        function smokeLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2.6;
            if (s.clock < dt) {
                s.body.x = -70;
                s.anim.lastX = -70;
                s.lastCloud = -999;
            }
            const dashing = s.clock < 0.5;
            s.body.dashTimer = dashing ? 1 : 0;
            s.speed = dashing ? 240 : 0;
            s.heading = 0;
            if (dashing && Math.abs(s.body.x - s.lastCloud) >= 34) {
                s.lastCloud = s.body.x;
                s.fx.smokes.push({ x: s.body.x, y: 0, age: 0, seconds: 2, radius: 58, seed: s.body.x });
            }
        }

        function echoLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 1.2;
            if (s.clock < 0.3 && Math.random() < 0.6) {
                const x = -70 + s.clock / 0.3 * 140;
                s.ghosts.push({ x, y: 0, age: 0, seconds: 0.3, angle: 0, dark: true });
            }
        }

        function phoenixLoop(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2.2;
            if (s.clock < 1.3) state.phoenixFx = { x: s.body.x, y: s.body.y, age: s.clock, seconds: 1.3 };
        }

        function wispLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            state.wisp.x = -26 + Math.cos(s.clock * 1.7) * 6;
            state.wisp.y = -40 + Math.sin(s.clock * 2.3) * 5;
            state.wisp.placed = true;
            state.wisp.flash = (s.clock % 1.2) < 0.16 ? 0.1 : 0;
            if (s.clock % 1.2 < dt) s.fx.bolts.push({ x: state.wisp.x, y: state.wisp.y, vx: 380, vy: 40, soul: true, age: 0 });
            s.fx.bolts = s.fx.bolts.filter(b => {
                b.age += dt;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                return b.age < 0.5;
            });
        }

        function hexLoop(s, dt) {
            s.clock = (s.clock ?? 0) + dt;
            s.fx.enemies.forEach(e => { e.hexTimer = 1; });
            if (s.clock < 1) return;
            s.clock = 0;
            const [a, b] = s.fx.enemies;
            s.fx.lightning.push({ points: [{ x: a.x, y: a.y }, { x: b.x, y: b.y }], life: 0.26, maxLife: 0.26, hex: true });
        }

        function riftLoop(s, dt) {
            s.clock = (s.clock ?? 2) + dt;
            if (s.clock < 2) return;
            s.clock = 0;
            const evolved = s.evolved.length > 0;
            s.fx.rifts.push({ x: 0, y: 0, age: 0, seconds: 1.5, radius: evolved ? 100 : 74, evolved });
        }

        const bladeFx = [
            ['Bloodlust: fome subindo', scene({ levels: { bloodlust: 5 }, before: bloodlustLoop })],
            ['Crimson Tide', scene({ levels: { bloodlust: 5 }, evolved: ['bloodlust'], before: crescentLoop })],
            ['Cataclysm: rachaduras em lava', scene({ before: moveLoop('slam', 0.5, slamImpactFx(true)) })],
            ['Executioner', front({ fx: { ...createFx(), enemies: [dummy(40, 0, { stunned: 1 })] }, before: executeLoop })]
        ];
        const guardFx = [
            ['Shadow Clone: guarda (1)', scene({ guard: true, noHero: true, fx: { ...createFx(), enemies: guardMonsters([0.4]) }, before: guardLoop })],
            ['Shadow Legion: guarda (3)', scene({ guard: true, legion: true, noHero: true, fx: { ...createFx(), enemies: guardMonsters([0.4, 2.5, 4.6]) }, before: guardLoop })]
        ];
        const shadowFx = [
            ['Death Mark', scene({ fx: { ...createFx(), enemies: [dummy(44, 0)] }, before: markLoop })],
            ['Smoke Bomb: rasto', scene({ fx: { ...createFx(), enemies: [dummy(30, 26)] }, before: smokeLoop })],
            ['Night Reaper: sombra', scene({ before: echoLoop })],
            ['Oath of Whispers: combate', oathScene('whispers', { fx: { ...createFx(), enemies: [dummy(44, 0, { marked: 1 })] }, before: slashEvery(0.8, 1) })]
        ];
        const flameFx = [
            ['Hearth Ring', scene({ levels: { fireRing: 1 }, heading: 0 })],
            ['Solar Wall', scene({ levels: { fireRing: 5 }, evolved: ['fireRing'] })],
            ['Vigil: escudo', front({ before: (s) => { s.body.vigilStance = true; s.body.shield = 1; } })],
            ['Phoenix Pact', scene({ before: phoenixLoop })]
        ];
        const curseFx = [
            ['Grave Wisp', scene({ levels: { graveWisp: 1 }, before: wispLoop })],
            ['Creeping Hex', scene({ fx: { ...createFx(), enemies: [dummy(40, -18), dummy(70, 24)] }, before: hexLoop })],
            ['Void Rift', scene({ before: riftLoop })],
            ['Event Horizon', scene({ levels: { voidRift: 5 }, evolved: ['voidRift'], before: riftLoop })]
        ];

        // --- JURAMENTOS COM AS SKILLS DO RAMO ---
        // Cada forma em ação com o que o ramo faz: é o que a página do jogo mostra. Ciclos: 2,4s, 2,6s, 2,4s e 2s.
        function beginMove(s, kind) {
            const { seconds, impactAt } = HERO_25D_VISUALS.moves[kind];
            s.body.move = { kind, age: 0, seconds, impactAt };
        }

        function runMove(s, dt, onImpact) {
            const move = s.body.move;
            if (!move) return;
            move.age += dt;
            if (!move.hit && move.age >= move.seconds * move.impactAt) {
                move.hit = true;
                onImpact?.(s);
            }
            if (move.age >= move.seconds) s.body.move = null;
        }

        function swingNow(s, step) {
            const look = SLASH_VISUALS[step];
            s.anim.lastComboStep = step;
            s.body.comboStep = step === 3 ? 1 : step + 1;
            s.slashes.push({ x: s.body.x, y: s.body.y, angle: s.body.angle, radius: 70, comboStep: step, spin: false, shadow: false, arcWidth: 1.4, life: look.lifeSeconds, maxLife: look.lifeSeconds });
        }

        // Blade: golpes lançando meias-luas de sangue, depois o salto que racha o chão
        function slaughterShow(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2.4;
            state.bloodlust.stacks = 8;
            runMove(s, dt, slamImpactFx(true));
            if (s.clock >= 1.25 && s.clock < 1.25 + dt) beginMove(s, 'slam');
            if (s.body.move) return;
            s.swing = (s.swing ?? 0) - dt;
            if (s.clock < 1.1 && s.swing <= 0) {
                s.swing = 0.37;
                s.step = s.step === 1 ? 2 : 1;
                swingNow(s, s.step);
                s.fx.crescents.push({ x: s.body.x, y: s.body.y, angle: 0, vx: 300, vy: 0, age: 0 });
            }
        }

        // Shadow: o dash detona a marca, deixa o rasto de fumaça e a sombra corta de novo
        function whispersShow(s, dt) {
            smokeLoop(s, dt);
            const target = s.fx.enemies[0];
            target.marked = s.clock < 0.25 ? 1 : 0;
            if (s.clock >= 0.25 && s.clock < 0.25 + dt) s.fx.markBursts.push({ x: target.x, y: target.y, age: 0, seconds: 0.3, radius: 14, big: true });
            if (s.clock > 0.7 && s.clock < 1 && Math.random() < 0.6) {
                s.ghosts.push({ x: -70 + (s.clock - 0.7) / 0.3 * 120, y: 0, age: 0, seconds: 0.22, angle: 0, dark: true });
            }
        }

        // Flame: ajoelhado atrás do escudo, com a muralha de fogo em volta; o escudo estoura e volta
        function hearthShow(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2.4;
            s.body.vigilStance = true;
            s.body.shield = s.clock >= 1.8 && s.clock < 2.2 ? 0 : 1;
            if (s.clock < dt) wave(s, 130, '#fef08a', 10, 0.45);
            if (s.clock >= 1.8 && s.clock < 1.8 + dt) wave(s, 120, '#fb923c', 8, 0.35);
        }

        // Curse: a fenda se abre na horda, a caveira atira e a maldição pula entre os monstros
        function ruinShow(s, dt) {
            s.clock = ((s.clock ?? 0) + dt) % 2;
            const k = s.clock;
            state.wisp.placed = true;
            state.wisp.x = -26 + Math.cos(k * Math.PI) * 6;
            state.wisp.y = -40 + Math.sin(k * 4.7) * 5;
            state.wisp.flash = 0;
            if (k < dt) s.fx.rifts.push({ x: 78, y: 8, age: 0, seconds: 1.5, radius: 70, evolved: true });
            if (k >= 0.3 && k < 0.3 + dt) s.fx.bolts.push({ x: state.wisp.x, y: state.wisp.y, vx: 380, vy: 30, soul: true, age: 0 });
            s.fx.bolts = s.fx.bolts.filter(b => {
                b.age += dt;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                return b.age < 0.5;
            });
            s.fx.enemies.forEach(e => { e.hexTimer = 1; });
            if (k >= 1.1 && k < 1.1 + dt) {
                const [a, b] = s.fx.enemies;
                s.fx.lightning.push({ points: [{ x: a.x, y: a.y }, { x: b.x, y: b.y }], life: 0.26, maxLife: 0.26, hex: true });
            }
        }

        const oathShow = [
            ['Oath of Slaughter: skills', oathScene('slaughter', { oath: 'oathSlaughter', levels: { bloodlust: 5 }, evolved: ['bloodlust'], before: slaughterShow })],
            ['Oath of Whispers: skills', oathScene('whispers', { oath: 'oathWhispers', fx: { ...createFx(), enemies: [dummy(-10, 22)] }, before: whispersShow })],
            ['Oath of the Hearth: skills', oathScene('hearth', {
                oath: 'oathHearth', levels: { fireRing: 5 }, evolved: ['fireRing'], before: hearthShow,
                // No jogo o anel tem 200 de raio: aqui é menor, para a muralha e o herói caberem juntos no quadro
                tweak: () => {
                    const old = EVOLUTIONS.fireRing.levels.radius;
                    EVOLUTIONS.fireRing.levels.radius = 92;
                    return () => { EVOLUTIONS.fireRing.levels.radius = old; };
                }
            })],
            ['Oath of Ruin: skills', oathScene('ruin', { oath: 'oathRuin', levels: { voidRift: 5, graveWisp: 1 }, evolved: ['voidRift'], fx: { ...createFx(), enemies: [dummy(55, -22), dummy(100, 30)] }, before: ruinShow })]
        ];

        // Modo captura (gera as animações da página do jogo): ?capture=<rótulo>&size=400&zoom=2&lift=12 desenha só essa
        // cena, em um quadrado. Sem o parâmetro a página é a prévia completa.
        const params = new URLSearchParams(location.search);
        const captureLabel = params.get('capture');
        const captureSize = Number(params.get('size') ?? 400);
        if (captureLabel) {
            ctx.canvas.width = captureSize;
            ctx.canvas.height = captureSize;
        }
        const everyScene = new Map([
            ...poses, ...swings, ...effects, ...heroes, ['Shadow Clone', clone], ...oathIdle, ...oathRun, ...oathSwing, ...oathShow,
            ...heroMoves, ...heroMoves2, ...bladeFx, ...shadowFx, ...guardFx, ...flameFx, ...curseFx
        ]);

        function gallery(title, top, items, zoom = 2.3) {
            text(title, 24, top, 17, '#67e8f9', 700);
            const w = (WIDTH - 48 - (items.length - 1) * 12) / items.length;
            items.forEach(([label, s], i) => {
                const x = 24 + i * (w + 12);
                view(s, x, top + 12, w, 220, zoom, s.dt);
                text(label, x + 6, top + 250, 13);
            });
        }

        // --- ADAGA ---
        // Duas direções: arremesso para a direita (mão esquerda atrás do corpo) e para baixo-esquerda (mão na frente)
        const FACINGS = [[0.25, 'para a direita'], [2.2, 'para baixo e à esquerda']];
        const LOOP_SECONDS = 1.3;
        const letGo = K.throwSeconds * K.letGoFraction;
        const steps = [
            [0.04, 'segura'], [0.18, 'puxa'], [0.3, 'acima do ombro'],
            [0.4, 'lança'], [0.5, 'solta'], [0.75, 'volta']
        ];

        // Herói arremessando no instante "elapsed" (segundos desde o início do arremesso).
        // Usa performance.now(), o mesmo relógio que o desenho do herói usa para a animação.
        function drawThrowAt(x, y, facing, elapsed) {
            const now = performance.now();
            heroAnim.facing = facing;
            state.knifeThrowTime = now - elapsed * 1000;
            player.x = x;
            player.y = y;
            player.iFrames = 0;
            player.hitTime = -100000;
            const flight = elapsed - letGo;
            const cos = Math.cos(facing);
            const sin = Math.sin(facing);
            const travelled = flight * KNIFE_SKILL.speed;
            state.knives = flight > 0 && travelled < 330 ? [{
                x: x + cos * (K.spawnForward + travelled) - sin * K.spawnSide,
                y: y + sin * (K.spawnForward + travelled) + cos * K.spawnSide,
                angle: facing,
                travelled
            }] : [];
            const m = ctx.getTransform();
            setWorldView(m.a, m.e, m.f);    // os carimbos usam a transformação do mundo
            renderKnives();
            renderPlayer25D();
            state.knifeThrowTime = -100000;
        }

        function drawKnifeSection(now, base) {
            text('Adaga: arremesso ao vivo (loop)', 24, base, 17, '#67e8f9', 700);
            const loop = ((now - start) / 1000) % LOOP_SECONDS;
            panel(24, base + 10, 570, 260, () => {
                ctx.scale(2, 2);
                drawThrowAt(50, 70, FACINGS[0][0], loop);
            });
            panel(606, base + 10, 570, 260, () => {
                ctx.scale(2, 2);
                drawThrowAt(220, 40, FACINGS[1][0], loop);
            });

            FACINGS.forEach(([facing, label], row) => {
                const top = base + 310 + row * 260;
                text(`Quadro a quadro: ${label}`, 24, top - 10, 15, '#94a3b8', 600);
                steps.forEach(([k, name], i) => {
                    panel(24 + i * 192, top, 180, 200, () => {
                        ctx.scale(2.4, 2.4);
                        drawThrowAt(row === 0 ? 30 : 45, row === 0 ? 52 : 40, facing, k * K.throwSeconds);
                    });
                    text(`${i + 1}. ${name}`, 32 + i * 192, top + 220);
                });
            });

            text('Adaga em detalhe', 24, base + 845, 15, '#94a3b8', 600);
            const cx = 560;
            const cy = base + 970;
            const zoom = 20;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(zoom, zoom);
            drawDagger(ctx, now / 1000);
            ctx.restore();

            const S = K.shape;
            // [x, y na adaga, texto, -1 acima / 1 abaixo, alinhamento]
            const notes = [
                [S.pommelX, 0.6, 'pomo dourado + gema', 1, 'right'],
                [(S.gripStart + S.gripEnd) / 2, 0.8, 'cabo de couro com tiras', 1, 'left'],
                [S.guardX + 0.4, -2.4, 'guarda curva', -1, 'right'],
                [S.bladeStart + 2.8, -0.6, 'runas', -1, 'left'],
                [6.5, 0, 'nervura central', 1, 'left'],
                [9, -0.6, 'fio brilhante', -1, 'left']
            ];
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
            ctx.lineWidth = 1;
            notes.forEach(([x, y, label, dir, align]) => {
                const px = cx + x * zoom;
                const py = cy + y * zoom;
                const ly = cy + dir * 90;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px, ly);
                ctx.stroke();
                ctx.font = '13px system-ui, sans-serif';
                const w = ctx.measureText(label).width;
                const tx = align === 'right' ? px - w + 4 : px - 4;
                text(label, tx, ly + (dir < 0 ? -6 : 16));
            });
        }

        function frame() {
            const now = performance.now();
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            if (captureLabel) {
                view(everyScene.get(captureLabel), 0, 0, captureSize, captureSize, Number(params.get('zoom') ?? 2), dt, Number(params.get('lift') ?? 12));
                requestAnimationFrame(frame);
                return;
            }
            ctx.fillStyle = '#050b16';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            text('DEMON HUNTER: tudo do herói', 24, 34, 20, '#fde68a', 700);

            text('Correndo nas oito direções', 24, 66, 17, '#67e8f9', 700);
            running.forEach((s, i) => {
                view(s, 24 + i * 145, 78, 137, 170, 1.7, dt);
                text(OCTANT_NAMES[i], 30 + i * 145, 266, 12);
            });

            [...poses, ...swings, ...effects, ...heroes, ['Shadow Clone', clone], ...oathIdle, ...oathRun, ...oathSwing, ...oathShow,
                ...heroMoves, ...slamFrames, ...oathFrames, ...heroMoves2, ...bladeFx, ...shadowFx, ...guardFx, ...flameFx, ...curseFx].forEach(([, s]) => { s.dt = dt; });
            gallery('Poses', 300, poses);
            gallery('Golpes (com a marca do corte)', 570, swings, 1.7);
            gallery('Dash, dano, nível e Mirror Ward', 840, effects, 1.9);
            gallery('Heróis e Shadow Clone', 1110, [...heroes, ['Shadow Clone', clone]], 2);

            gallery('Juramentos: as quatro formas', 1380, oathIdle, 2.5);
            gallery('Juramentos em movimento', 1650, oathRun, 2);
            gallery('Juramentos em combate', 1920, oathSwing, 2);
            gallery('Juramentos com as skills do ramo', 2190, oathShow, 1.2);
            gallery('Golpes especiais', 2460, heroMoves, 1.45);
            gallery('Earthbreaker quadro a quadro', 2730, slamFrames, 1.7);
            gallery('Juramento quadro a quadro', 3000, oathFrames, 1.8);
            gallery('Mais poses', 3270, heroMoves2, 1.45);
            gallery('Skills de Blade', 3540, bladeFx, 1.05);
            gallery('Skills de Shadow', 3810, shadowFx, 1.05);
            gallery('Shadow Clone e Shadow Legion (guarda da tocha)', 4080, guardFx, 1.1);
            gallery('Skills de Flame', 4350, flameFx, 0.52);
            gallery('Skills de Curse', 4620, curseFx, 0.82);
            drawKnifeSection(now, 4890);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
