<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévia do Demon Lord</title>
    <style>
        body { margin: 0; background: #050b16; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <!-- Página de desenvolvimento: mostra o Demon Lord (boss) usando o código real do jogo -->
    <canvas id="gameCanvas" width="1200" height="760"></canvas>
    <script type="module">
        import { BOSS_MODELS } from './data_model/bosses.js';
        import { ctx, state } from './js/core/state.js';
        import { renderDemonFireball, renderDemonLord } from './js/render/demon_lord.js';

        state.gameState = 'PLAYING';     // o boss só anima durante a partida
        const M = BOSS_MODELS.DEMON_LORD;
        const make = (angle, phase) => ({ x: 0, y: 0, angle, phase, radius: M.radius, shootTimer: M.patternGapSeconds });

        const main = make(0, 0.4);
        const facings = [-Math.PI / 2, Math.PI / 2, Math.PI].map((a, i) => make(a, 1 + i));
        const fireball = { x: 0, y: 0, vx: M.projectileSpeed, vy: 0, radius: M.projectileRadius };
        let last = performance.now();

        function text(str, x, y, size = 13, color = '#cbd5e1', weight = 400) {
            ctx.fillStyle = color;
            ctx.font = `${weight} ${size}px system-ui, sans-serif`;
            ctx.fillText(str, x, y);
        }

        function panel(x, y, w, h, zoom, draw) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#0b1424';
            ctx.fillRect(0, 0, w, h);
            ctx.beginPath();
            ctx.rect(0, 0, w, h);
            ctx.clip();
            ctx.scale(zoom, zoom);
            draw();
            ctx.restore();
        }

        function frame() {
            const now = performance.now();
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#050b16';
            ctx.fillRect(0, 0, 1200, 760);

            // Ciclo de tiro igual ao do jogo
            main.shootTimer = M.patternGapSeconds - ((now / 1000) % M.patternGapSeconds);
            fireball.x = ((now / 1000 * M.projectileSpeed) % 900) - 450;

            text('DEMON LORD — prévia (boss)', 24, 34, 20, '#f87171', 700);
            text('carregando e lançando fogo (ampliado 2x)', 24, 60);
            panel(24, 76, 700, 460, 2, () => {
                main.x = 175;
                main.y = 115;
                renderDemonLord(main);
            });

            text('direções: cima, baixo, esquerda', 748, 60);
            facings.forEach((e, i) => {
                panel(748, 76 + i * 156, 428, 148, 1, () => {
                    e.x = 214;
                    e.y = 74;
                    renderDemonLord(e);
                });
            });

            text('bola de fogo (ampliada 3x)', 24, 568);
            panel(24, 584, 1152, 150, 3, () => {
                fireball.y = 25;
                fireball.x = Math.abs(fireball.x) + 20;
                renderDemonFireball(fireball);
            });

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
