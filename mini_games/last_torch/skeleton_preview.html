<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévia do Esqueleto</title>
    <style>
        body { margin: 0; background: #050b16; }
        canvas { display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <!-- Página de desenvolvimento: mostra o Esqueleto (monstro normal) usando o código real do jogo -->
    <canvas id="gameCanvas" width="1200" height="760"></canvas>
    <script type="module">
        import { MONSTER_MODELS } from './data_model/monsters.js';
        import { ctx, state } from './js/core/state.js';
        import { renderSkeleton } from './js/render/skeleton.js';

        state.gameState = 'PLAYING';     // o esqueleto só anima a passada durante a partida
        const radius = MONSTER_MODELS.SKELETON.radius;
        const make = (x, y, angle, phase) => ({ x, y, angle, phase, radius, hp: 100, maxHp: 100 });

        // Andando de um lado para o outro; quatro direções; um levando dano a cada segundo
        const walker = make(40, 28, 0, 0.3);
        const facings = [-Math.PI / 2, 0, Math.PI / 2, Math.PI].map((a, i) => make(0, 0, a, 1 + i));
        const hurt = make(0, 0, Math.PI / 2, 2.4);
        let last = performance.now();
        let dir = 1;
        let hurtTimer = 0;

        function text(str, x, y, size = 13, color = '#cbd5e1', weight = 400) {
            ctx.fillStyle = color;
            ctx.font = `${weight} ${size}px system-ui, sans-serif`;
            ctx.fillText(str, x, y);
        }

        function panel(x, y, w, h, zoom, draw) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = '#0b1424';
            ctx.fillRect(0, 0, w, h);
            ctx.beginPath();
            ctx.rect(0, 0, w, h);
            ctx.clip();
            ctx.scale(zoom, zoom);
            draw();
            ctx.restore();
        }

        function frame() {
            const now = performance.now();
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#050b16';
            ctx.fillRect(0, 0, 1200, 760);

            walker.x += dir * 70 * dt;
            if (walker.x > 240) { dir = -1; walker.angle = Math.PI; }
            if (walker.x < 40) { dir = 1; walker.angle = 0; }
            hurtTimer += dt;
            if (hurtTimer > 1) { hurtTimer = 0; hurt.hp -= 5; }

            text('Andando (loop)', 24, 30, 15, '#94a3b8', 600);
            panel(24, 40, 1152, 230, 4, () => renderSkeleton(walker));

            text('Direções (cima, direita, baixo, esquerda) e levando dano', 24, 305, 15, '#94a3b8', 600);
            facings.forEach((e, i) => {
                panel(24 + i * 232, 315, 220, 260, 4.5, () => {
                    e.x = 24; e.y = 29;
                    renderSkeleton(e);
                });
            });
            panel(24 + 4 * 232, 315, 220, 260, 4.5, () => {
                hurt.x = 24; hurt.y = 29;
                renderSkeleton(hurt);
            });
            ['cima', 'direita', 'baixo', 'esquerda', 'levando dano'].forEach((label, i) => text(label, 32 + i * 232, 595));

            text('Tamanho real no jogo', 24, 640, 15, '#94a3b8', 600);
            panel(24, 650, 1152, 90, 1, () => {
                [0, 0.8, 1.6, 2.4, 3.2].forEach((p, i) => {
                    const e = facings[i % 4];
                    renderSkeleton({ ...make(60 + i * 90, 45, p, p) });
                });
            });

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
