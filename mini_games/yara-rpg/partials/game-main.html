<main id="game-main" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 items-start gap-4 mb-4" hidden>
    <div id="region-objective-toast" class="region-objective-toast" role="status" aria-live="polite" hidden></div>
    <section id="region-arrival-transition" class="region-arrival-transition" hidden role="status" aria-live="polite" aria-labelledby="region-arrival-title">
        <div id="region-arrival-scene" class="region-arrival-scene" data-region="dark-forest">
            <div class="region-arrival-art" aria-hidden="true">
                <span id="region-arrival-icon">🌲</span>
            </div>
            <div class="region-arrival-copy">
                <p id="region-arrival-kicker" class="region-arrival-kicker"></p>
                <h2 id="region-arrival-title"></h2>
                <p id="region-arrival-description"></p>
            </div>
            <button id="region-arrival-close" type="button" class="region-arrival-close" onclick="dismissRegionArrival()">×</button>
        </div>
    </section>
    {% include_relative partials/hero-panel.html %}
    {% include_relative partials/exploration-panel.html %}
</main>
