<dialog id="region-objectives-dialog" class="item-drop-dialog region-objectives-dialog" aria-labelledby="region-objectives-title" aria-describedby="region-objectives-description">
    <div class="item-drop-content">
        <div class="equipment-bag-heading">
            <div>
                <h2 id="region-objectives-title" class="text-lg font-bold text-amber-300"></h2>
                <p id="region-objectives-description" class="mt-1 text-xs text-gray-300"></p>
            </div>
            <button type="button" class="dialog-close-button" onclick="closeRegionObjectives()" data-i18n-aria="closeObjectives" aria-label="Fechar objetivos">×</button>
        </div>
        <p id="region-objectives-progress" class="region-objectives-progress"></p>
        <ul id="region-objectives-list" class="region-objectives-list"></ul>
        <button type="button" class="story-event-choice region-objectives-close" onclick="closeRegionObjectives()" data-i18n="closeObjectives">Fechar</button>
    </div>
</dialog>

<dialog id="mobile-character-panel-dialog" class="item-drop-dialog mobile-character-panel-dialog" aria-labelledby="mobile-character-panel-title">
    <div class="item-drop-content">
        <div class="equipment-bag-heading">
            <h2 id="mobile-character-panel-title" class="text-lg font-bold text-amber-300"></h2>
            <button type="button" class="dialog-close-button" onclick="closeMobileCharacterPanel()" aria-label="Fechar">×</button>
        </div>
        <div id="mobile-character-panel-content"></div>
    </div>
</dialog>

<dialog id="passive-detail-dialog" class="item-drop-dialog passive-detail-dialog" aria-labelledby="passive-detail-title" aria-describedby="passive-detail-description">
    <div class="item-drop-content">
        <div class="equipment-bag-heading">
            <div>
                <h2 id="passive-detail-title" class="text-lg font-bold text-emerald-200"></h2>
            </div>
            <button type="button" class="dialog-close-button" onclick="closePassiveDetails()" data-i18n-aria="closePassiveDetails" aria-label="Fechar passiva">×</button>
        </div>
        <div class="passive-detail">
            <span id="passive-detail-icon" class="passive-detail-icon" aria-hidden="true"></span>
            <p id="passive-detail-description" class="passive-detail-description"></p>
        </div>
    </div>
</dialog>

<dialog id="equipment-bag-dialog" class="item-drop-dialog equipment-bag-dialog" aria-labelledby="equipment-bag-title" aria-describedby="equipment-bag-description">
        <div class="item-drop-content">
            <div class="equipment-bag-heading">
                <div>
                    <h2 id="equipment-bag-title" class="text-lg font-bold text-amber-300" data-i18n="inventory">Mochila</h2>
                    <p id="equipment-bag-description" class="mt-1 text-xs text-gray-300" data-i18n="equipmentBagDescription">Até 12 equipamentos guardados.</p>
                </div>
                <span id="equipment-bag-dialog-count" class="equipped-item-count">0/12</span>
                <button id="close-equipment-bag-button" type="button" class="dialog-close-button" data-i18n-aria="closeBag" aria-label="Fechar mochila">×</button>
            </div>
            <p id="equipment-bag-pending-item" class="equipment-bag-pending" hidden></p>
            <div class="equipment-bag-bulk-actions">
                <span id="equipment-bag-selected-count" class="equipment-bag-selected-count">0 selecionados</span>
                <button id="discard-selected-items-button" type="button" class="equipment-bag-action equipment-bag-discard" data-i18n="discardSelectedItems" disabled>Descartar selecionados</button>
            </div>
            <div id="equipment-inventory-list" class="equipment-bag-slots" role="list"></div>
        </div>
    </dialog>

    <dialog id="item-drop-dialog" class="item-drop-dialog" aria-labelledby="item-drop-title" aria-describedby="item-drop-message item-drop-choice-help">
        <div class="item-drop-content">
            <div class="equipment-bag-heading">
                <div>
                    <h2 id="item-drop-title" class="text-lg font-bold text-amber-300" data-i18n="itemDropTitle">Equipamento encontrado</h2>
                </div>
                <button id="close-acquired-equipment-button" type="button" class="dialog-close-button" data-i18n-aria="closeItemDetails" aria-label="Fechar detalhes do equipamento" hidden>×</button>
            </div>
            <p id="item-drop-message" class="mt-2 text-sm text-gray-200"></p>
            <p id="item-drop-choice-help" class="mt-2 text-xs text-gray-300" data-i18n="itemDropChoiceHelp">Equipar o novo guarda o atual na mochila; manter o atual guarda o item encontrado.</p>
            <div class="equipment-comparison" role="group" aria-labelledby="item-drop-title">
                <section class="equipment-comparison-card equipment-comparison-new" aria-labelledby="item-drop-new-name">
                    <span class="equipment-comparison-label" data-i18n="newEquipmentLabel">Encontrado</span>
                    <span id="item-drop-new-icon" class="equipment-comparison-icon" aria-hidden="true"></span>
                    <h3 id="item-drop-new-name" class="equipment-comparison-name"></h3>
                    <p id="item-drop-new-slot" class="equipment-comparison-slot"></p>
                    <ul id="item-drop-new-bonuses" class="equipment-comparison-bonuses"></ul>
                </section>
                <span class="equipment-comparison-arrow" aria-hidden="true">→</span>
                <div class="equipment-comparison-current-group">
                    <section class="equipment-comparison-card equipment-comparison-current" aria-labelledby="item-drop-current-name">
                        <span class="equipment-comparison-label" data-i18n="equippedEquipmentLabel">Equipado</span>
                        <span id="item-drop-current-icon" class="equipment-comparison-icon" aria-hidden="true"></span>
                        <h3 id="item-drop-current-name" class="equipment-comparison-name"></h3>
                        <p id="item-drop-current-slot" class="equipment-comparison-slot"></p>
                        <ul id="item-drop-current-bonuses" class="equipment-comparison-bonuses"></ul>
                    </section>
                </div>
            </div>
            <div id="item-drop-actions" class="item-drop-actions">
                <button id="equip-new-item-button" type="button" class="item-drop-action item-drop-action-primary" data-i18n="equipRightHand">Equipar na mão direita</button>
                <button id="keep-current-item-button" type="button" class="item-drop-action item-drop-action-secondary" data-i18n="keepCurrentItem">Manter atual</button>
                <button id="equip-other-hand-from-drop-button" type="button" class="item-drop-action item-drop-action-alternative"></button>
                <button id="open-bag-from-drop-button" type="button" class="item-drop-action item-drop-action-open-bag" data-i18n="openBag">Abrir mochila</button>
                <button id="discard-pending-item-button" type="button" class="item-drop-action item-drop-action-discard" data-i18n="discard">Descartar item encontrado</button>
            </div>
        </div>
    </dialog>

    <dialog id="equipment-item-dialog" class="item-drop-dialog equipment-item-dialog" aria-labelledby="equipment-item-title">
        <div class="item-drop-content">
            <div class="equipment-item-heading">
                <span id="equipment-item-icon" aria-hidden="true"></span>
                <h2 id="equipment-item-title" class="text-lg font-bold text-amber-300"></h2>
                <button id="close-equipment-item-button" type="button" class="dialog-close-button" data-i18n-aria="closeItemDetails" aria-label="Fechar detalhes do equipamento">×</button>
            </div>
            <p id="equipment-item-slot" class="mt-1 text-xs text-gray-300"></p>
            <ul id="equipment-item-properties" class="equipment-item-properties"></ul>
            <div class="equipment-item-actions">
                <button id="equipment-item-upgrade-button" type="button" class="equipment-bag-action equipment-bag-upgrade"></button>
                <button id="equipment-item-equip-button" type="button" class="equipment-bag-action equipment-bag-equip" data-i18n="equipRightHand">Equipar na mão direita</button>
                <button id="equipment-item-equip-other-hand-button" type="button" class="equipment-bag-action equipment-bag-equip"></button>
                <button id="equipment-item-unequip-button" type="button" class="equipment-bag-action equipment-bag-discard" data-i18n="unequip">Desequipar</button>
                <button id="equipment-item-discard-button" type="button" class="equipment-bag-action equipment-bag-discard" data-i18n="discard">Descartar</button>
            </div>
        </div>
    </dialog>

<dialog id="meta-dialog" class="item-drop-dialog meta-dialog" aria-labelledby="meta-dialog-title">
    <div class="item-drop-content">
        <div class="equipment-bag-heading">
            <h2 id="meta-dialog-title" class="text-lg font-bold text-amber-300" data-i18n="metaSanctuaryTitle">🏛️ Santuário</h2>
            <button type="button" class="dialog-close-button" onclick="YaraMeta?.closeSanctuary()" data-i18n-aria="metaClose" aria-label="Fechar">×</button>
        </div>
        <div id="meta-dialog-tabs" class="meta-tabs"></div>
        <div id="meta-dialog-body" class="meta-body"></div>
    </div>
</dialog>

<dialog id="vendor-dialog" class="item-drop-dialog meta-dialog" aria-labelledby="vendor-dialog-title">
    <div class="item-drop-content">
        <div class="equipment-bag-heading">
            <h2 id="vendor-dialog-title" class="text-lg font-bold text-amber-300" data-i18n="vendorDialogTitle">🛒 O vendedor ambulante</h2>
            <span id="vendor-dialog-gold" class="equipped-item-count"></span>
            <button type="button" class="dialog-close-button" onclick="YaraVendor?.close()" data-i18n-aria="metaClose" aria-label="Fechar">×</button>
        </div>
        <div id="vendor-dialog-body" class="meta-body"></div>
    </div>
</dialog>

<div id="meta-toast" class="meta-toast" role="status" hidden></div>
<div id="rarity-flash" class="rarity-flash" aria-hidden="true" hidden></div>
