<header class="w-full max-w-4xl text-center mb-4">
        <nav id="game-nav" class="flex items-center justify-between gap-3 mb-6 text-left" aria-label="Navegação do jogo" data-i18n-aria="gameNav">
            {% unless page.standalone %}
            <a id="game-home" href="../../pt/" class="inline-flex items-center gap-2 rounded-lg border border-emerald-900/80 bg-black/30 px-3 py-2 text-xs font-medium text-emerald-200 transition hover:border-emerald-500 hover:text-white">
                <span aria-hidden="true">←</span> <span data-i18n="backToSite">Voltar ao site</span>
            </a>
            {% else %}
            <span aria-hidden="true"></span>
            {% endunless %}
            <div class="flex items-center gap-3">
                <span class="hidden text-right text-[10px] uppercase tracking-[0.18em] text-emerald-400/70 sm:block" data-i18n="gameLabel">Mini RPG · Floresta Sombria</span>
                <button id="open-settings" type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-emerald-900/80 bg-black/30 text-emerald-200 transition hover:border-emerald-500 hover:text-white" aria-label="Configurações" data-i18n-aria="openSettings" data-i18n-title="openSettings" title="Configurações">
                    <span aria-hidden="true">⚙️</span>
                </button>
            </div>
        </nav>
        <p id="save-status" class="game-save-status" role="status" aria-live="polite" hidden></p>
        <h1 class="text-2xl sm:text-4xl font-extrabold text-amber-500 tracking-wide drop-shadow-[0_2px_10px_rgba(245,158,11,0.3)]">
            <span data-i18n="title">YARA, DEMON HUNTER: PERDIDOS NA NÉVOA - MINI RPG</span>
        </h1>
    </header>
