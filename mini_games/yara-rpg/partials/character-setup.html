<section id="character-setup" class="character-setup" aria-labelledby="setup-title">
        <div class="setup-heading">
            <p class="start-kicker" data-i18n="setupKicker">Prepare sua jornada</p>
        </div>
        <section class="setup-section" aria-labelledby="character-selection-title">
            <h3 id="character-selection-title" class="setup-section-title" data-i18n="selectCharacter">Personagem</h3>
            <div id="character-options" class="character-options" role="group" aria-label="Personagens" data-i18n-aria="selectCharacter"></div>
        </section>
        <div class="setup-actions">
            <button id="sanctuary-button" type="button" class="start-secondary-button sanctuary-button" onclick="YaraMeta?.openSanctuary('achievements')" data-i18n-aria="metaSanctuaryLabel" data-i18n-title="metaSanctuaryHint" aria-label="Santuário" title="Conquistas, bestiário, coleções e poderes descobertos">
                <span class="btn-icon" aria-hidden="true">🏛️</span><span class="btn-label" data-i18n="metaSanctuaryLabel">Santuário</span>
            </button>
            <button id="continue-adventure-button" type="button" class="start-secondary-button" hidden data-i18n-aria="continueAdventure" aria-label="Continuar">
                <span data-i18n="continueAdventure">Continuar</span>
            </button>
            <button id="begin-adventure-button" type="button" class="start-primary-button" disabled data-i18n="beginAdventure">Iniciar aventura</button>
        </div>
    </section>
