<section id="character-setup" class="character-setup" aria-labelledby="setup-title">
        <div class="setup-heading">
            <p class="start-kicker" data-i18n="setupKicker">Prepare sua jornada</p>
        </div>
        <section class="setup-section" aria-labelledby="character-selection-title">
            <h3 id="character-selection-title" class="setup-section-title" data-i18n="selectCharacter">Personagem</h3>
            <div id="character-options" class="character-options" role="group" aria-label="Personagens" data-i18n-aria="selectCharacter"></div>
        </section>
        <section class="setup-section" aria-labelledby="equipment-selection-title">
            <div class="starter-equipment-heading">
                <h3 id="equipment-selection-title" class="setup-section-title" data-i18n="selectStarterEquipment">Equipamentos iniciais</h3>
                <span id="starter-equipment-count" class="starter-equipment-count">0</span>
            </div>
            <div id="starter-equipment-options" class="starter-equipment-options" role="group" aria-label="Equipamento inicial" data-i18n-aria="selectStarterEquipment"></div>
        </section>
        <div class="setup-actions">
            <button id="continue-adventure-button" type="button" class="start-secondary-button" hidden data-i18n="continueAdventure">Continuar jornada salva</button>
            <button id="begin-adventure-button" type="button" class="start-primary-button" disabled data-i18n="beginAdventure">Iniciar aventura</button>
        </div>
    </section>
