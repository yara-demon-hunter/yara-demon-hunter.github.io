<div id="yara-rpg-container" class="w-full max-w-4xl mx-auto my-6 p-4 bg-fantasy-card/90 rounded-2xl border border-fantasy-border shadow-xl">
    <div class="text-center mb-4">
        <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-500 tracking-wider font-title">YARA: A REGRA DO SINO</h2>
        <p class="text-xs text-emerald-400/80 tracking-widest uppercase mt-1">Crônicas de Sobrevivência na Floresta Sombria</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <!-- Painel do Personagem -->
        <section class="bg-forest-950/80 rounded-xl p-4 border border-fantasy-border flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-fantasy-border pb-2 mb-3">
                    <div>
                        <h3 id="hero-name" class="font-bold text-amber-400">Zeph</h3>
                        <span class="text-xs text-emerald-300">Nível <span id="hero-level">1</span></span>
                    </div>
                    <div class="text-right text-xs">
                        <span class="text-amber-400 block">Ouro: <span id="hero-gold" class="text-white">15</span> 🪙</span>
                        <span class="text-purple-400">XP: <span id="hero-xp">0</span>/<span id="hero-xp-max">30</span></span>
                    </div>
                </div>

                <!-- Barras de Status -->
                <div class="space-y-2 mb-3 text-xs">
                    <div>
                        <div class="flex justify-between font-semibold mb-1"><span class="text-red-400">❤️ HP</span><span><span id="hero-hp">100</span>/<span id="hero-hp-max">100</span></span></div>
                        <div class="w-full bg-black rounded-full h-3 p-0.5 border border-fantasy-border">
                            <div id="hero-hp-bar" class="bg-red-600 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between font-semibold mb-1"><span class="text-blue-400">⚡ Foco</span><span><span id="hero-foco">50</span>/<span id="hero-foco-max">50</span></span></div>
                        <div class="w-full bg-black rounded-full h-2.5 p-0.5 border border-fantasy-border">
                            <div id="hero-foco-bar" class="bg-cyan-500 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-black/40 rounded-lg p-2.5 border border-fantasy-border flex items-center justify-between">
                <div class="text-xs">
                    <span class="text-gray-300 block">Poções: <span id="hero-potions" class="text-emerald-400 font-bold">3</span></span>
                </div>
                <button onclick="usePotion()" class="bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-semibold px-3 py-1.5 rounded transition">Beber</button>
            </div>
        </section>

        <!-- Área de Ação e Combate -->
        <section class="md:col-span-2 bg-forest-950/80 rounded-xl p-4 border border-fantasy-border flex flex-col justify-between">
            <div id="encounter-card" class="hidden bg-black/60 border border-red-900/50 rounded-lg p-3 mb-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span id="monster-icon" class="text-2xl">🐺</span>
                    <div>
                        <h4 id="monster-name" class="font-bold text-red-400 text-sm">Inimigo</h4>
                        <span class="text-[10px] text-gray-400">Ameaça na Névoa</span>
                    </div>
                </div>
                <div class="text-right text-xs">
                    <span class="text-red-400">HP: <span id="monster-hp">40</span>/<span id="monster-hp-max">40</span></span>
                    <div class="w-24 bg-black rounded-full h-2 mt-1 border border-red-900/40">
                        <div id="monster-hp-bar" class="bg-red-600 h-full rounded-full transition-all duration-300" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <div id="exploration-banner" class="bg-black/30 border border-forest-800 rounded-lg p-3 mb-3 text-center text-xs text-emerald-300">
                🌲 O sino tocou tarde demais. Explore a trilha ou descanse no acampamento.
            </div>

            <div id="rpg-log" class="rpg-scroll bg-black/70 border border-fantasy-border rounded-lg p-3 h-36 overflow-y-auto space-y-1.5 text-xs mb-3 font-mono">
                <div class="text-emerald-400 border-l-2 border-emerald-500 pl-2">[Início] Zeph adentra a Floresta Sombria...</div>
            </div>

            <!-- Controles -->
            <div id="action-controls">
                <div id="controls-explore" class="grid grid-cols-2 gap-2">
                    <button onclick="exploreForest()" class="bg-emerald-700 hover:bg-emerald-600 text-white font-semibold py-2 px-3 rounded-lg text-xs transition">🧭 Explorar Trilha</button>
                    <button onclick="restAtCamp()" class="bg-forest-800 hover:bg-forest-700 text-emerald-200 font-semibold py-2 px-3 rounded-lg text-xs transition">⛺ Acampar</button>
                </div>
                <div id="controls-combat" class="hidden grid grid-cols-4 gap-1.5">
                    <button onclick="combatQuickAttack()" class="bg-stone-800 hover:bg-stone-700 text-amber-300 font-semibold py-2 px-1 rounded-lg text-[11px] transition">🗡️ Rápido</button>
                    <button onclick="combatHeavyAttack()" class="bg-red-900/80 hover:bg-red-800 text-white font-semibold py-2 px-1 rounded-lg text-[11px] transition">💥 Pesado</button>
                    <button onclick="combatDefend()" class="bg-blue-900/80 hover:bg-blue-800 text-white font-semibold py-2 px-1 rounded-lg text-[11px] transition">🛡️ Defesa</button>
                    <button onclick="combatRun()" class="bg-stone-900 hover:bg-stone-800 text-stone-300 font-semibold py-2 px-1 rounded-lg text-[11px] transition">🏃 Fugir</button>
                </div>
            </div>
        </section>
    </div>
</div>
