<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yara RPG · Ajuste ao vivo</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #0c0a06; color: #d6cfbf; font-family: system-ui, sans-serif; }
        header {
            position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
            padding: 10px 16px; background: #0c0a06; border-bottom: 1px solid #3a3322;
        }
        header a.back { color: #a8a08c; font-size: 13px; margin-right: 6px; }
        header h1 { margin: 0 8px 0 0; font-size: 18px; color: #fde68a; }
        select, button, input[type=text], input[type=number] {
            background: #17140d; color: #e7dfcc; border: 1px solid #3a3322; border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px;
        }
        button { cursor: pointer; font-weight: 600; }
        button:hover, button:focus-visible { border-color: #fbbf24; outline: none; }
        button.primary { background: #3a2f17; border-color: #5c5137; }
        label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 12px; padding: 12px 16px 40px; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
        .views { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(240px, calc(50% - 5px)), 1fr)); align-content: start; }
        figure { margin: 0; background: #17140d; border: 1px solid #2a2418; border-radius: 10px; overflow: hidden; }
        figure canvas { display: block; width: 100%; aspect-ratio: 1; }
        figcaption { padding: 5px 9px 7px; font-size: 12px; color: #c9c0aa; }
        aside { position: sticky; top: calc(var(--header-h, 52px) + 12px); max-height: calc(100vh - var(--header-h, 52px) - 24px); overflow: auto; background: #120f09; border: 1px solid #2a2418; border-radius: 10px; padding: 10px 12px; }
        /* Celular: as vistas ficam numa faixa fixa no topo (rola para o lado) e os controles logo abaixo, para ver o
           boneco enquanto mexe nos valores */
        @media (max-width: 900px) {
            aside { position: static; max-height: none; }
            .views {
                position: sticky; top: var(--header-h, 96px); z-index: 2; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
                gap: 8px; padding-bottom: 6px; background: #0c0a06;
            }
            .views figure { flex: 0 0 min(46vw, 260px); scroll-snap-align: start; }
        }
        details { border-bottom: 1px solid #2a2418; padding: 4px 0 8px; }
        summary { cursor: pointer; color: #fbbf24; font-weight: 700; font-size: 14px; padding: 6px 0; }
        .row { display: grid; grid-template-columns: 150px 1fr 68px; gap: 6px; align-items: center; margin: 3px 0; font-size: 12px; }
        .row.changed .name { color: #fde68a; }
        .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
        .row input[type=range] { width: 100%; accent-color: #fbbf24; }
        .row input[type=number] { width: 68px; padding: 3px 4px; font-size: 12px; }
        .row.wide { grid-template-columns: 150px 1fr; }
        .row input[type=text] { width: 100%; font: 12px ui-monospace, monospace; padding: 3px 5px; }
        .row input[type=text].bad { border-color: #ef4444; }
        .row input[type=color] { width: 100%; height: 24px; padding: 0; border: 1px solid #3a3322; border-radius: 4px; background: none; }
        .filter { width: 100%; margin: 4px 0 8px; }
        .hint { font-size: 12px; color: #7a725f; margin: 4px 0 8px; line-height: 1.4; }
        #out { width: 100%; min-height: 120px; margin-top: 6px; background: #0c0a06; color: #e7dfcc; border: 1px solid #3a3322; border-radius: 6px; font: 12px ui-monospace, monospace; padding: 6px; }
        .warn { padding: 24px; text-align: center; color: #fbbf24; }
    </style>
</head>
<body>
    <!-- Página de desenvolvimento: ajuste ao vivo das medidas, posições e cores de um boneco 2.5D do palco.
         Mexe direto nos objetos de js/data/visuals/hero25d.js (só na memória desta página). Para gravar, copie os
         valores alterados e cole no arquivo de dados. Como abrir: previews/README.md -->
    <header>
        <a class="back" href="index.html">← Prévias</a>
        <h1>Ajuste ao vivo</h1>
        <select id="model" aria-label="Personagem"></select>
        <label class="check"><input id="pause" type="checkbox"> Pausar</label>
        <button id="copy" class="primary">Copiar alterados</button>
        <button id="reset">Desfazer tudo</button>
    </header>
    <div class="layout">
        <main class="views" id="views"></main>
        <aside>
            <input id="filter" class="filter" type="text" placeholder="Filtrar (ex.: eye, ear, hair)">
            <p class="hint">Mude os valores e veja o boneco na hora. Os alterados ficam em amarelo. Para gravar:
                <b>Copiar alterados</b> e cole as linhas no bloco do personagem em
                <code>js/data/visuals/hero25d.js</code>. Os ajustes ficam guardados neste navegador até você desfazer.</p>
            <div id="controls"></div>
            <textarea id="out" readonly placeholder="Os valores copiados aparecem aqui também"></textarea>
        </aside>
    </div>

    <script src="../js/data/characters.js"></script>
    <script src="../js/data/visuals/hero25d.js"></script>
    <script src="../js/data/visuals/stage.js"></script>
    <script src="../js/stage/fx.js"></script>
    <script src="../js/stage/azael25d.js"></script>
    <script src="../js/stage/yara25d.js"></script>
    <script src="../js/stage/zeph25d.js"></script>
    <script src="../js/stage/oskar25d.js"></script>
    <script src="../js/stage/hero25d.js"></script>
    <script>
        (() => {
            const DATA = window.YaraRpgData;
            const VIS = DATA.visuals.hero25d;
            const STAGE = DATA.visuals.stage;
            const HERO = window.YaraStage25D?.hero;
            if (!HERO) {
                document.getElementById('views').innerHTML = '<p class="warn">Os scripts do palco não carregaram. Veja previews/README.md.</p>';
                return;
            }
            const $ = (id) => document.getElementById(id);

            // --- PERSONAGENS ---
            // Cada boneco tem o seu bloco de dados (cores, medidas, posições); 'hunter' usa as cores do herói.
            // O bloco 'body' (medidas do corpo de todos) entra junto, numa seção à parte.
            const MODELS = [
                ['oskar', 'Oskar', VIS.oskar],
                ['zeph', 'Zeph', VIS.zeph],
                ['yara', 'Yara', VIS.yara],
                ['azael', 'Azael (Mysterious Creature)', VIS.azael],
                ['hunter', 'Demon Hunter', VIS.hero]
            ].filter(([, , block]) => block);
            const params = new URLSearchParams(location.search);
            MODELS.forEach(([key, name]) => $('model').add(new Option(name, key)));
            $('model').value = MODELS.some(([k]) => k === params.get('model')) ? params.get('model') : MODELS[0][0];

            // Cópia dos valores originais (para marcar o que mudou e desfazer)
            const clone = (v) => JSON.parse(JSON.stringify(v));
            const ORIGINAL = { body: clone(VIS.body) };
            MODELS.forEach(([key, , block]) => { ORIGINAL[key] = clone(block); });

            // --- AJUSTES GUARDADOS NESTE NAVEGADOR ---
            const STORE = 'yara-rpg-tuner';
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch { saved = {}; }
            const persist = () => {
                try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch { /* sem armazenamento: só nesta aba */ }
            };
            // Aplica um valor num caminho ("colors.skin", "face") do bloco
            const getAt = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);
            const setAt = (obj, path, value) => {
                const keys = path.split('.');
                const last = keys.pop();
                keys.reduce((o, k) => o[k], obj)[last] = value;
            };
            const blockOf = (key) => (key === 'body' ? VIS.body : MODELS.find(([k]) => k === key)[2]);
            Object.entries(saved).forEach(([key, edits]) => {
                if (!ORIGINAL[key]) return;
                Object.entries(edits).forEach(([path, value]) => {
                    try { setAt(blockOf(key), path, value); } catch { /* chave que não existe mais */ }
                });
            });

            // --- CONTROLES ---
            const isColor = (v) => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
            // Faixa do controle deslizante a partir do valor original
            // (vai sempre para os dois lados: posições podem ser negativas, ex.: para trás ou para baixo)
            function rangeFor(v) {
                const a = Math.abs(v);
                const max = a === 0 ? 2 : a < 1 ? Math.max(2, a * 3) : Math.max(4, a * 2.5);
                const min = -max;
                const step = a >= 20 ? 0.5 : a >= 5 ? 0.1 : 0.01;
                return { min, max, step };
            }
            const fmt = (v) => (typeof v === 'number' ? +v.toFixed(3) : v);

            function markRow(row, key, path) {
                const now = JSON.stringify(getAt(blockOf(key), path));
                const was = JSON.stringify(getAt(ORIGINAL[key], path));
                row.classList.toggle('changed', now !== was);
            }
            function commit(key, path, value, row) {
                setAt(blockOf(key), path, value);
                saved[key] = saved[key] || {};
                if (JSON.stringify(value) === JSON.stringify(getAt(ORIGINAL[key], path))) delete saved[key][path];
                else saved[key][path] = value;
                persist();
                markRow(row, key, path);
            }

            function controlRow(key, path, value) {
                const row = document.createElement('div');
                row.className = 'row';
                row.dataset.search = `${path}`.toLowerCase();
                const name = document.createElement('span');
                name.className = 'name';
                // Eixos dos vetores: a = frente, b = lado (direita +), z = altura
                name.textContent = path.replace(/^colors\./, '').replace(/\.0$/, ' (a frente)').replace(/\.1$/, ' (b lado)').replace(/\.2$/, ' (z altura)');
                name.title = path;
                row.appendChild(name);
                if (typeof value === 'number') {
                    const r = rangeFor(getAt(ORIGINAL[key], path) ?? value);
                    const range = Object.assign(document.createElement('input'), { type: 'range', min: r.min, max: r.max, step: r.step, value });
                    const num = Object.assign(document.createElement('input'), { type: 'number', step: r.step, value: fmt(value) });
                    range.addEventListener('input', () => { num.value = fmt(+range.value); commit(key, path, +range.value, row); });
                    num.addEventListener('input', () => {
                        if (num.value === '' || isNaN(+num.value)) return;
                        const v = +num.value;
                        if (v < +range.min) range.min = v;
                        if (v > +range.max) range.max = v;
                        range.value = v;
                        commit(key, path, v, row);
                    });
                    row.append(range, num);
                } else if (isColor(value)) {
                    row.classList.add('wide');
                    const color = Object.assign(document.createElement('input'), { type: 'color', value });
                    color.addEventListener('input', () => commit(key, path, color.value, row));
                    row.appendChild(color);
                } else {
                    // Listas (ex.: o contorno do rosto) e cores rgba: edita como texto
                    row.classList.add('wide');
                    const text = Object.assign(document.createElement('input'), { type: 'text', value: typeof value === 'string' ? value : JSON.stringify(value) });
                    text.addEventListener('change', () => {
                        try {
                            const v = typeof value === 'string' ? text.value : JSON.parse(text.value);
                            text.classList.remove('bad');
                            commit(key, path, v, row);
                        } catch {
                            text.classList.add('bad');
                        }
                    });
                    row.appendChild(text);
                }
                markRow(row, key, path);
                return row;
            }

            // Agrupa as chaves do bloco por assunto, para achar rápido
            const GROUPS = [
                ['Rosto: posições', /^(eye|iris|brow|nose|mouth|ear|face|jaw|beard|mustache)/],
                ['Cabeça e cabelo', /^(head|hair|bang|side|tail|band|scarf|faceT|recede)/],
                ['Corpo', /^(shoulder|waist|hip|arm|leg|boot|toe|heel|claw|run|cape|bodyScale)/],
                ['Braços (offsets)', /^(right|left)(Hand|Elbow)/],
                ['Arma', /^(blade|glow|scabbard|sheath|hilt|guard|draw|axe|grip)/]
            ];
            function sectionFor(path) {
                if (path.startsWith('colors.')) return 'Cores';
                const key = path.split('.')[0];
                const g = GROUPS.find(([, re]) => re.test(key));
                return g ? g[0] : 'Outros';
            }

            function buildControls() {
                const key = $('model').value;
                const block = blockOf(key);
                const root = $('controls');
                root.innerHTML = '';
                const sections = new Map();
                const add = (title, el, open) => {
                    if (!sections.has(title)) {
                        const det = document.createElement('details');
                        det.open = open;
                        const sum = document.createElement('summary');
                        sum.textContent = title;
                        det.appendChild(sum);
                        sections.set(title, det);
                    }
                    sections.get(title).appendChild(el);
                };
                const order = ['Rosto: posições', 'Cabeça e cabelo', 'Corpo', 'Braços (offsets)', 'Arma', 'Outros', 'Cores'];
                const entries = [];
                Object.entries(block).forEach(([k, v]) => {
                    if (k === 'colors') Object.entries(v).forEach(([c, cv]) => entries.push([`colors.${c}`, cv]));
                    // Vetores de posição/direção (até 3 números, ex.: scabbardMouth): um controle por eixo
                    else if (Array.isArray(v) && v.length <= 3 && v.every(x => typeof x === 'number')) {
                        v.forEach((x, i) => entries.push([`${k}.${i}`, x]));
                    } else if (typeof v === 'number' || Array.isArray(v) || typeof v === 'string') entries.push([k, v]);
                });
                entries.sort((a, b) => order.indexOf(sectionFor(a[0])) - order.indexOf(sectionFor(b[0])));
                entries.forEach(([path, v]) => add(sectionFor(path), controlRow(key, path, v), sectionFor(path) !== 'Cores'));
                // Medidas do corpo de todos os bonecos (bloco body)
                Object.entries(VIS.body).forEach(([k, v]) => {
                    if (typeof v === 'number') add('Corpo de todos (body)', controlRow('body', k, v), false);
                });
                sections.forEach(det => root.appendChild(det));
                applyFilter();
            }
            function applyFilter() {
                const q = $('filter').value.trim().toLowerCase();
                document.querySelectorAll('#controls .row').forEach(r => { r.style.display = !q || r.dataset.search.includes(q) ? '' : 'none'; });
                if (q) document.querySelectorAll('#controls details').forEach(d => { d.open = true; });
            }
            $('filter').addEventListener('input', applyFilter);

            // Linhas para colar no arquivo de dados (só o que mudou)
            function changedLines() {
                const lines = [];
                const keys = [$('model').value, 'body'];
                keys.forEach(key => {
                    const edits = saved[key] || {};
                    const plain = Object.entries(edits).filter(([p]) => !p.startsWith('colors.'));
                    const colors = Object.entries(edits).filter(([p]) => p.startsWith('colors.'));
                    if (!plain.length && !colors.length) return;
                    const blockName = key === 'body' ? 'BODY' : key === 'hunter' ? 'HERO' : key.toUpperCase();
                    lines.push(`// ${blockName} (js/data/visuals/hero25d.js)`);
                    // Eixos de vetores (scabbardMouth.1) saem como o vetor inteiro: scabbardMouth: [1.6, 3.7, 11]
                    const vectors = new Set();
                    plain.forEach(([p, v]) => {
                        const m = p.match(/^(\w+)\.(\d)$/);
                        if (m) {
                            if (vectors.has(m[1])) return;
                            vectors.add(m[1]);
                            const arr = blockOf(key)[m[1]].map(fmt);
                            lines.push(`        ${m[1]}: [${arr.join(', ')}],`);
                            return;
                        }
                        lines.push(`        ${p}: ${JSON.stringify(typeof v === 'number' ? fmt(v) : v).replace(/,/g, ', ')},`);
                    });
                    if (colors.length) {
                        lines.push('        // colors: { ... }');
                        colors.forEach(([p, v]) => lines.push(`            ${p.slice(7)}: '${v}',`));
                    }
                });
                return lines.length ? lines.join('\n') : '// Nada alterado';
            }
            $('copy').addEventListener('click', async () => {
                const text = changedLines();
                $('out').value = text;
                try {
                    await navigator.clipboard.writeText(text);
                    $('copy').textContent = 'Copiado!';
                } catch {
                    $('out').select();
                    $('copy').textContent = 'Selecione e copie abaixo';
                }
                setTimeout(() => { $('copy').textContent = 'Copiar alterados'; }, 1600);
            });
            $('reset').addEventListener('click', () => {
                const key = $('model').value;
                [key, 'body'].forEach(k => {
                    Object.keys(saved[k] || {}).forEach(path => setAt(blockOf(k), path, clone(getAt(ORIGINAL[k], path))));
                    delete saved[k];
                });
                persist();
                buildControls();
                $('out').value = '';
            });

            // --- VISTAS ---
            const pitch = STAGE.camera.pitchDeg * Math.PI / 180;
            const CAM_STAGE = { heightScale: Math.cos(pitch), groundSquash: Math.sin(pitch) };
            const RIGHT = STAGE.facing.right;
            const LEFT = STAGE.facing.left;
            const RUN = STAGE.speed.runPx;
            // o: { facing, scale, footY, camera ('top' = vista de cima), walk, swing, loop }
            const VIEWS = [
                ['Rosto · palco, para a direita', { facing: RIGHT, scale: 15, footY: 1.4 }],
                ['Rosto · palco, para a esquerda', { facing: LEFT, scale: 15, footY: 1.4 }],
                ['Rosto · de frente', { facing: Math.PI / 2, scale: 15, footY: 1.4 }],
                ['Rosto · de perfil', { facing: 0, scale: 15, footY: 1.4 }],
                ['Palco · parado', { facing: RIGHT, scale: 7 }],
                ['Palco · andando', { facing: RIGHT, scale: 7, walk: true }],
                ['Palco · golpe', { facing: RIGHT, scale: 7, swing: 1, loop: 1.1 }],
                ['Tamanho do jogo', { facing: RIGHT, scale: 3.4 }],
                ['De cima · girando', { facing: (t) => t * 0.8, scale: 6, camera: 'top', footY: 0.7 }]
            ];
            const views = VIEWS.map(([label, o]) => {
                const fig = document.createElement('figure');
                const canvas = document.createElement('canvas');
                const cap = document.createElement('figcaption');
                cap.textContent = label;
                fig.append(canvas, cap);
                $('views').appendChild(fig);
                return { o, canvas, g: canvas.getContext('2d'), anim: HERO.createAnim(typeof o.facing === 'function' ? 0 : o.facing), body: { hitTime: -99, move: null }, t: 0, lap: -1 };
            });

            function look() {
                const key = $('model').value;
                const cfg = Object.values(STAGE.characters).find(c => c.model === key);
                return { model: key, colors: cfg?.colors ? { ...blockOf(key).colors, ...cfg.colors } : undefined };
            }

            function tick(v, dt) {
                const o = v.o;
                v.t += dt;
                const loop = o.loop ?? 1.6;
                const lap = Math.floor(v.t / loop);
                if (lap !== v.lap) {
                    v.lap = lap;
                    if (o.swing) HERO.startSwing(v.anim, o.swing);
                }
                const face = typeof o.facing === 'function' ? o.facing(v.t) : o.facing;
                HERO.updateAnim(v.anim, { vx: o.walk ? Math.cos(face) * RUN : 0, vy: o.walk ? Math.sin(face) * RUN : 0, face }, dt);
            }

            function draw(v, w, h, L) {
                const o = v.o;
                const g = v.g;
                g.fillStyle = '#17140d';
                g.fillRect(0, 0, w, h);
                HERO.render(g, v.body, v.anim, {
                    x: w / 2,
                    y: h * (o.footY ?? 0.82),
                    scale: o.scale * (w / 260),
                    model: L.model,
                    colors: L.colors,
                    camera: o.camera === 'top' ? undefined : CAM_STAGE,
                    time: v.t
                });
            }

            let last = performance.now();
            function frame(now) {
                const dt = $('pause').checked ? 0 : Math.min(0.05, (now - last) / 1000);
                last = now;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const L = look();
                views.forEach(v => {
                    const w = v.canvas.clientWidth;
                    const h = v.canvas.clientHeight;
                    if (!w || !h) return;
                    if (v.canvas.width !== Math.round(w * dpr)) {
                        v.canvas.width = Math.round(w * dpr);
                        v.canvas.height = Math.round(h * dpr);
                    }
                    if (dt > 0) tick(v, dt);
                    v.g.setTransform(dpr, 0, 0, dpr, 0, 0);
                    draw(v, w, h, L);
                });
                requestAnimationFrame(frame);
            }

            $('model').addEventListener('change', () => {
                history.replaceState(null, '', `?model=${$('model').value}`);
                buildControls();
                $('out').value = '';
            });
            buildControls();
            // Altura do cabeçalho (muda no celular): as vistas e o painel grudam logo abaixo dele
            const header = document.querySelector('header');
            const setHeader = () => document.documentElement.style.setProperty('--header-h', `${header.offsetHeight}px`);
            setHeader();
            window.addEventListener('resize', setHeader);
            // Primeiros quadros já com a animação andando (para os testes automáticos e para não começar parado)
            views.forEach(v => { for (let i = 0; i < 30; i++) tick(v, 1 / 60); });
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
