<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório · Demon Hunter pintado (2D)</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; color: #d6cfbf; font-family: system-ui, sans-serif; }
        #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
        #home { position: fixed; top: 10px; left: 10px; z-index: 2; padding: 6px 10px; border: 1px solid #2a3943; border-radius: 8px; background: rgba(7, 12, 16, .86); color: #b9e8fb; text-decoration: none; font-size: 13px; }
        #panel { position: fixed; z-index: 2; top: 10px; right: 10px; width: 270px; max-height: calc(100% - 20px); overflow: auto; padding: 12px 14px; border: 1px solid #283946; border-radius: 10px; background: rgba(7, 12, 16, .88); font-size: 13px; line-height: 1.4; }
        h1 { margin: 0 0 2px; color: #c4efff; font-size: 16px; } .sub { margin: 0 0 10px; color: #8998a3; font-size: 11px; }
        h2 { margin: 12px 0 5px; color: #75c9ed; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        label { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer; } input[type="range"] { width: 100%; accent-color: #38bdf8; }
        label.col { flex-direction: column; align-items: stretch; gap: 2px; }
        button { width: 100%; margin-top: 8px; padding: 7px; border: 1px solid #315569; border-radius: 6px; background: #10232d; color: #d9f3ff; font: inherit; cursor: pointer; }
        button.on { background: #1d4a63; border-color: #38bdf8; }
        #hint { color: #72808b; font-size: 11px; } @media (max-width: 640px) { #panel { width: 205px; font-size: 12px; } }
    </style>
</head>
<body>
    <canvas id="stage"></canvas><a id="home" href="index.html">← Laboratório</a>
    <aside id="panel">
        <h1>Demon Hunter · pintado e animado</h1>
        <p class="sub">Caminho 1: o desenho pintado é recortado em camadas e o movimento vem de código. Nenhum arquivo do Last Torch é carregado ou modificado.</p>
        <h2>Movimento</h2>
        <div style="display:flex;gap:6px"><button id="modeIdle" class="on" type="button">Parado</button><button id="modeRun" type="button">Correndo</button></div>
        <label class="col">Vento na capa <input id="wind" type="range" min="0" max="2" step=".05" value="1"></label>
        <label class="col">Respiração <input id="breath" type="range" min="0" max="2" step=".05" value="1"></label>
        <label class="col">Balanço do capuz <input id="hood" type="range" min="0" max="2" step=".05" value="1"></label>
        <h2>Luz</h2>
        <label class="col">Direção da tocha <input id="lightAngle" type="range" min="0" max="360" step="1" value="215"></label>
        <label class="col">Força da luz <input id="lightPower" type="range" min="0" max="1" step=".02" value=".22"></label>
        <label><input id="eyes" type="checkbox" checked> Brilho nos olhos da máscara</label>
        <label><input id="mist" type="checkbox" checked> Névoa ao fundo</label>
        <h2>Comparar</h2>
        <label><input id="still" type="checkbox"> Mostrar a imagem original (parada)</label>
        <label><input id="layers" type="checkbox"> Destacar as camadas (capuz em vermelho)</label>
        <button id="shot" type="button">Salvar foto (PNG)</button>
        <p id="hint">Estudo de arte: só da cintura para cima, como o retrato pintado de origem.</p>
    </aside>
    <script type="module" src="demon_hunter_pintado.js"></script>
</body>
</html>
