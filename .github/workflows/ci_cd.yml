# This workflow builds the Jekyll site and deploys it to GitHub Pages.
name: CI/CD - Build and Deploy

on:
  # Run the workflow whenever there is a push / pull request to the main branch.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allow the workflow to be started manually from GitHub Actions.
  workflow_dispatch:

permissions:
  # Allows the workflow to read the repository contents.
  contents: read

  # Allows the workflow to deploy the generated site to GitHub Pages.
  pages: write

  # Allows GitHub Actions to authenticate with GitHub Pages.
  id-token: write

# Prevent multiple deployments from running at the same time.
# If a new commit is pushed while a deployment is running,
# the current deployment will finish before the next one starts.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  # Installs the Ruby environment and dependencies,
  # then builds the Jekyll site into the _site directory.
  build:
    runs-on: ubuntu-latest

    steps:

      # Download the repository contents into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Ruby and restore the Bundler dependency cache.
      # The Ruby version should be compatible with the project's Gemfile.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Build the Jekyll site.
      # The generated static files are placed inside the _site directory.
      - name: Build Jekyll site
        run: bundle exec jekyll build

      # Package the generated _site directory as a GitHub Pages artifact.
      # This artifact will be consumed by the deploy job below.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ==========================================
  # DEPLOY
  # ==========================================
  # Deploys the artifact generated by the build job
  # to GitHub Pages.
  deploy:
    # Use the GitHub Pages deployment environment.
    environment:
      name: github-pages

      # Expose the final deployed URL in the GitHub Actions UI.
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    # The deploy job only starts after the build job succeeds.
    needs: build

    steps:

      # Deploy the generated artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4