# This workflow builds the Jekyll site and deploys it to GitHub Pages.
name: CI/CD - Build and Deploy

on:
  # Run the workflow whenever there is a push / pull request to the main branch.
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allow the workflow to be started manually from GitHub Actions.
  workflow_dispatch:

permissions:
  # Allows the workflow to read the repository contents.
  contents: read

  # Allows the workflow to deploy the generated site to GitHub Pages.
  pages: write

  # Allows GitHub Actions to authenticate with GitHub Pages.
  id-token: write

# Prevent multiple deployments from running at the same time.
# If a new commit is pushed while a deployment is running,
# the current deployment will finish before the next one starts.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  # Installs the Ruby environment and dependencies,
  # then builds the Jekyll site into the _site directory.
  build:
    runs-on: ubuntu-latest

    steps:

      # Download the repository contents into the GitHub Actions runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Ruby and restore the Bundler dependency cache.
      # The Ruby version should be compatible with the project's Gemfile.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Validate book data and translated chapter index metadata.
      - name: Validate content metadata
        run: ruby script/validate_content.rb

      # Build the Jekyll site.
      # The generated static files are placed inside the _site directory.
      - name: Build Jekyll site
        run: bundle exec jekyll build

      # Package the generated _site directory as a GitHub Pages artifact.
      # This artifact will be consumed by the deploy job below.
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ==========================================
  # DEPLOY
  # ==========================================
  # Deploys the artifact generated by the build job
  # to GitHub Pages.
  deploy:
    # Use the GitHub Pages deployment environment.
    environment:
      name: github-pages

      # Expose the final deployed URL in the GitHub Actions UI (from whichever attempt succeeded).
      url: ${{ steps.deploy_1.outputs.page_url || steps.deploy_2.outputs.page_url || steps.deploy_3.outputs.page_url }}

    runs-on: ubuntu-latest

    # The deploy job only starts after the build job succeeds.
    needs: build

    # Tentativas do deploy. O GitHub Pages às vezes demora para confirmar a publicação do lado dele: se uma tentativa
    # passar do tempo (DEPLOY_TIMEOUT_MS), o job espera RETRY_WAIT_SECONDS e tenta de novo, até 3 tentativas.
    # Só a última tentativa falha o job.
    env:
      RETRY_WAIT_SECONDS: 120

    steps:

      # Tentativa 1
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          # Tempo máximo esperando o GitHub Pages confirmar esta tentativa, em milissegundos (30 minutos).
          timeout: 1800000

      - name: Wait before retry
        if: steps.deploy_1.outcome == 'failure'
        run: sleep "$RETRY_WAIT_SECONDS"

      # Tentativa 2 (só roda se a 1 falhou)
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_2
        if: steps.deploy_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

      - name: Wait before last retry
        if: steps.deploy_2.outcome == 'failure'
        run: sleep "$RETRY_WAIT_SECONDS"

      # Tentativa 3 (só roda se a 2 falhou). Sem continue-on-error: se esta falhar, o job falha.
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy_3
        if: steps.deploy_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
