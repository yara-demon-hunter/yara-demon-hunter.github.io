{% if page.last_updated %}
    <p class="last-updated{% if include.position == 'top' %} last-updated--top{% endif %}">
        {% if page.lang == "pt" %}
            Última atualização:
        {% else %}
            Last updated:
        {% endif %}
        <time datetime="{{ page.last_updated | date: '%Y-%m-%d' }}">
            {{ page.last_updated | date: "%d/%m/%Y" }}
        </time>
    </p>
{% endif %}
